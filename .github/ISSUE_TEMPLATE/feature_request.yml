name: Feature request
description: Suggest something MarkNow should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing, it's worth a look at [`docs/requirements.md`](https://github.com/ntson9p/marknow/blob/main/docs/requirements.md).
        It has a decision log explaining what was deliberately left out and why, plus a
        "later" list at the end — your idea may already be on it.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: >
        Describe what you were trying to do and where the app got in your way. Please start
        here rather than with the solution — the underlying problem often has a better fix
        than the one that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: Including "I use a different editor for this" — that's useful to know.
    validations:
      required: false

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd be up for opening a pull request for this
          required: false
